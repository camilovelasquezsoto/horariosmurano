[build]
  command = "npm install"
  publish = "public"
  functions = "netlify/functions"

# Redireccionamos todas las peticiones que empiecen con /api/ a nuestra función serverless
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Redireccionamos cualquier otra ruta no encontrada al index.html para soportar SPA (opcional pero recomendado)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
