<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Murano Puerto Montt - Horarios</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080808;
            --panel: #111111;
            --panel-hover: #181818;
            --accent: #FF5722;
            --accent-dim: rgba(255,87,34,0.15);
            --accent-glow: rgba(255,87,34,0.08);
            --text: #f0f0f0;
            --text-muted: #888888;
            --gray: #2a2a2a;
            --border: #222222;
            --success: #2ecc71;
            --danger: #e74c3c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Barlow', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-text-size-adjust: 100%;
        }

        body::before {
            content: '';
            display: block;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .hidden { display: none !important; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .view-anim { animation: fadeUp 0.35s ease-out; }

        /* ── HEADER ── */
        header {
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 64px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(8,8,8,0.97);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }

        .logo-box {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--accent);
            background: #1a1a1a;
            flex-shrink: 0;
        }
        .logo-box img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .brand {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-size: 1.5em;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1;
            white-space: nowrap;
        }
        .brand span { color: var(--accent); }
        .brand small {
            display: block;
            font-size: 0.42em;
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 3px;
            margin-top: 2px;
        }

        #auth-panel {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        #auth-panel span {
            font-size: 0.75em;
            color: var(--text-muted);
            font-weight: 500;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ── CONTAINER ── */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 16px;
            flex: 1;
            width: 100%;
        }

        /* ── NAV ── */
        .nav-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        /* ── BOTONES ── */
        button {
            cursor: pointer;
            padding: 10px 20px;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text-muted);
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.92em;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s ease;
            border-radius: 2px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        button:hover, button:active {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-glow);
        }

        /* ── GRID DE CARDS ── */
        #list-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            overflow: hidden;
            transition: background 0.2s;
        }
        .card:hover { background: var(--panel-hover); }
        .card.expanded { grid-column: 1 / -1; }

        .card-inner {
            display: flex;
            align-items: flex-start;
        }

        .card-info {
            flex-shrink: 0;
            width: 190px;
            padding: 16px;
            border-right: 1px solid var(--border);
        }

        .card-info h3 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.15em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 10px 0 6px;
            color: var(--text);
            line-height: 1.2;
        }

        /* Subtítulo opcional (address) en cards de gym */
        .card-info .card-address {
            font-size: 0.75em;
            color: var(--text-muted);
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .card-schedule {
            flex: 1;
            padding: 16px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Imagen cuadrada sin deformación */
        .img-box {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #1a1a1a;
            overflow: hidden;
            border-radius: 4px;
        }
        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            display: block;
            transition: transform 0.4s ease;
        }
        .card:hover .img-box img { transform: scale(1.03); }

        /* ── MAPA EN CARD DE GIMNASIO ── */
        .gym-map {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            border-radius: 4px;
            margin-top: 10px;
            display: block;
            background: #1a1a1a;
        }

        /* ── GRILLA DE HORARIOS ── */
        .schedule-grid {
            display: grid;
            grid-template-columns: 72px repeat(5, minmax(78px, 1fr));
            gap: 1px;
            background: var(--gray);
            border: 1px solid var(--gray);
            border-radius: 4px;
            overflow: hidden;
            width: 100%;
            min-width: 500px;
        }

        .cell {
            background: var(--bg);
            padding: 7px 5px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 56px;
        }
        .cell.header {
            background: #0d0d0d;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            color: var(--accent);
            font-size: 0.76em;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 9px 5px;
            min-height: auto;
        }
        .cell.time-label {
            background: #0d0d0d;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.66em;
            letter-spacing: 0.3px;
        }

        .event-card {
            background: var(--accent);
            color: #fff;
            padding: 6px 5px;
            border-radius: 3px;
            font-size: 0.69em;
            margin: 2px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            text-align: left;
            animation: fadeIn 0.3s ease;
        }
        .ev-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-size: 1.1em;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            line-height: 1.1;
        }
        .ev-gym { font-size: 0.85em; opacity: 0.85; }
        .ev-trainer { font-size: 0.85em; font-style: italic; opacity: 0.9; }
        .ev-actions { display: flex; gap: 4px; margin-top: 4px; }

        .btn-control {
            background: rgba(0,0,0,0.25);
            border: none;
            padding: 3px 7px;
            cursor: pointer;
            color: white;
            border-radius: 2px;
            font-size: 0.9em;
            transition: background 0.2s;
            line-height: 1.4;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .btn-control:hover, .btn-control:active { background: rgba(0,0,0,0.5); }
        .btn-control.danger { background: rgba(231,76,60,0.4); }
        .btn-control.danger:hover, .btn-control.danger:active { background: rgba(231,76,60,0.8); }

        /* ── FORMULARIOS ── */
        input, select {
            width: 100%;
            padding: 11px 14px;
            margin: 6px 0;
            background: #0e0e0e;
            border: 1px solid var(--border);
            border-radius: 2px;
            color: var(--text);
            font-family: 'Barlow', sans-serif;
            font-size: 0.9em;
            transition: border-color 0.2s;
            -webkit-appearance: none;
            appearance: none;
        }
        input:focus, select:focus { outline: none; border-color: var(--accent); }
        input::placeholder { color: var(--text-muted); }

        /* ── PANEL CARD (auth) ── */
        .panel-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            padding: 28px 24px;
            max-width: 480px;
        }
        .panel-card h2 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.7em;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            color: var(--accent);
        }

        /* ── PANEL ADMIN ── */
        .admin-panel-wide {
            background: var(--panel);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            padding: 28px 24px;
        }
        .admin-panel-wide h2 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.7em;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            color: var(--accent);
        }
        .admin-panel-wide h3 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 18px 0 6px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }
        .admin-panel-wide hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 20px 0;
        }

        .admin-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0d0d0d;
            padding: 10px 14px;
            margin-bottom: 4px;
            border: 1px solid var(--border);
            border-radius: 2px;
            font-size: 0.88em;
            gap: 10px;
            flex-wrap: wrap;
        }
        .item-actions { display: flex; gap: 6px; flex-shrink: 0; }

        details {
            background: #0d0d0d;
            margin-bottom: 8px;
            border: 1px solid var(--border);
            border-radius: 2px;
        }
        summary {
            padding: 11px 16px;
            cursor: pointer;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 0.88em;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-muted);
            list-style: none;
            display: flex;
            align-items: center;
            gap: 8px;
            -webkit-tap-highlight-color: transparent;
        }
        summary::-webkit-details-marker { display: none; }
        summary::before {
            content: '▶';
            font-size: 0.6em;
            color: var(--accent);
            transition: transform 0.2s;
        }
        details[open] summary::before { transform: rotate(90deg); }
        details[open] summary { color: var(--accent); }

        .btn-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        /* ── FAVORITOS ── */
        .favs-wrapper { grid-column: 1 / -1; }
        .favs-wrapper h2 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.5em;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            margin-bottom: 16px;
            padding: 16px 16px 0;
        }

        /* ── TOAST ── */
        #toast {
            position: fixed;
            bottom: 24px;
            right: 16px;
            left: 16px;
            max-width: 360px;
            margin: 0 auto;
            background: var(--panel);
            border: 1px solid var(--accent);
            border-left: 4px solid var(--accent);
            color: var(--text);
            padding: 13px 20px;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.93em;
            font-weight: 600;
            letter-spacing: 0.5px;
            z-index: 9999;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            pointer-events: none;
            border-radius: 2px;
        }
        #toast.show { opacity: 1; transform: translateY(0); }

        /* ── FOOTER ── */
        footer {
            background: #050505;
            border-top: 1px solid var(--border);
            padding: 40px 24px;
            margin-top: 60px;
            text-align: center;
        }
        .footer-brand {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-size: 1.4em;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 16px;
        }
        .footer-divider {
            width: 36px;
            height: 2px;
            background: var(--accent);
            margin: 14px auto;
        }
        .socials {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .socials a {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85em;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.2s;
            padding: 6px 0;
        }
        .socials a:hover { color: var(--accent); }
        .socials a svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }
        footer p {
            color: var(--text-muted);
            font-size: 0.8em;
            margin: 4px 0;
        }
        footer a.mail-link {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }
        footer a.mail-link:hover { color: var(--accent); }

        /* ── RESPONSIVE MÓVIL ── */
        @media (max-width: 640px) {
            header { padding: 0 12px; height: 58px; }
            .brand { font-size: 1.25em; }
            .brand small { display: none; }

            .container { padding: 20px 10px; }

            .nav-bar { gap: 6px; margin-bottom: 20px; }
            .nav-bar button { padding: 9px 14px; font-size: 0.82em; flex: 1 1 auto; text-align: center; }

            #list-container { grid-template-columns: 1fr; gap: 10px; }
            .card.expanded { grid-column: 1; }

            .card-inner { flex-direction: column; }
            .card-info {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border);
                padding: 14px;
                display: flex;
                flex-direction: row;
                gap: 14px;
                align-items: center;
            }
            .card-info .img-box {
                width: 80px;
                height: 80px;
                flex-shrink: 0;
                aspect-ratio: 1 / 1;
            }
            .card-info .card-text-group { flex: 1; min-width: 0; }
            .card-info h3 { margin: 0 0 6px; font-size: 1.05em; }
            .card-info .card-address { margin-bottom: 8px; }
            .card-info button { width: 100%; }

            .card-schedule { padding: 12px 10px; }

            /* Tabla de horarios scroll horizontal en móvil */
            .schedule-grid {
                min-width: 480px;
                font-size: 0.92em;
            }

            /* Mapa en móvil */
            .gym-map { aspect-ratio: 4 / 3; }

            .panel-card { padding: 20px 14px; max-width: 100%; }
            .admin-panel-wide { padding: 20px 14px; }

            footer { padding: 32px 16px; margin-top: 40px; }
            .socials { gap: 14px; }

            #toast { bottom: 16px; right: 10px; left: 10px; }
        }

        @media (max-width: 380px) {
            .nav-bar button { font-size: 0.76em; padding: 8px 10px; }
            .brand { font-size: 1.1em; }
            /* FIX scroll horizontal horarios en móvil */
.card-schedule {
    overflow-x: auto;
    overflow-y: hidden;
    width: 100%;
    max-width: 100%;
    touch-action: pan-x;
}

.schedule-grid {
    min-width: 560px;
}

/* scrollbar (opcional pero recomendado) */
.card-schedule::-webkit-scrollbar {
    height: 6px;
}
.card-schedule::-webkit-scrollbar-thumb {
    background: var(--accent);
    border-radius: 3px;
}
        }
    </style>
</head>
<body>

<div id="toast"></div>

<header>
    <div class="header-left">
        <div class="logo-box">
            <img src="logomurano.png" alt="Logo Murano">
        </div>
        <div class="brand" onclick="showView('main-view')">
            Murano<span>PM</span>
            <small>Puerto Montt</small>
        </div>
    </div>
    <div id="auth-panel"></div>
</header>

<div class="container">

    <!-- VISTA PRINCIPAL -->
    <div id="main-view" class="view-anim">
        <div class="nav-bar">
            <button onclick="renderList('gym')">Gimnasios</button>
            <button onclick="renderList('cat')">Categorías</button>
            <button onclick="renderList('trainer')">Profesores</button>
            <button style="border-color:var(--success); color:var(--success);" onclick="renderFavorites()">⭐ Favoritos</button>
        </div>
        <div id="list-container"></div>
    </div>

    <!-- VISTA AUTH -->
    <div id="auth-view" class="panel-card view-anim hidden">
        <h2>Acceso</h2>
        <button onclick="showView('main-view')" style="margin-bottom:20px;">← Volver</button>
        <input type="email" id="l_email" placeholder="Correo electrónico" autocomplete="email">
        <input type="password" id="l_pass" placeholder="Contraseña" autocomplete="current-password">
        <input type="text" id="r_key" placeholder="Clave admin (solo para registro)">
        <div class="btn-row" style="margin-top:14px;">
            <button onclick="login()" style="border-color:var(--accent); color:var(--accent);">Ingresar</button>
            <button onclick="register()" style="border-color:var(--success); color:var(--success);">Registrarse</button>
        </div>
    </div>

    <!-- VISTA ADMIN -->
    <div id="admin-panel-view" class="admin-panel-wide view-anim hidden">
        <h2>Panel Administración</h2>
        <button onclick="showView('main-view')" style="margin-bottom:20px;">← Volver</button>

        <h3>Crear Entrenamiento</h3>
        <select id="t_gym"></select>
        <select id="t_cat"></select>
        <select id="t_day">
            <option value="Lunes">Lunes</option>
            <option value="Martes">Martes</option>
            <option value="Miércoles">Miércoles</option>
            <option value="Jueves">Jueves</option>
            <option value="Viernes">Viernes</option>
        </select>
        <select id="t_start">
            <option value="17:30">17:30 – 19:00</option>
            <option value="19:00">19:00 – 20:30</option>
            <option value="20:30">20:30 – 22:00</option>
            <option value="22:00">22:00 – 23:30</option>
        </select>
        <div class="btn-row">
            <button onclick="saveTraining()" style="border-color:var(--success); color:var(--success);">Crear Entrenamiento</button>
        </div>

        <hr>
        <h3>Gimnasio</h3>
        <input type="text" id="g_name" placeholder="Nombre del gimnasio">
        <input type="text" id="g_address" placeholder="Dirección">
        <input type="text" id="g_img" placeholder="URL imagen del gimnasio">
        <div class="btn-row">
            <button onclick="saveGym()" style="border-color:var(--accent); color:var(--accent);">Guardar Gimnasio</button>
        </div>

        <hr>
        <h3>Categoría / Profesor</h3>
        <input type="text" id="cat_name" placeholder="Nombre de la categoría">
        <input type="text" id="trainer_name" placeholder="Nombre del entrenador">
        <input type="text" id="cat_img" placeholder="URL imagen categoría">
        <input type="text" id="trainer_img" placeholder="URL foto entrenador">
        <div class="btn-row">
            <button onclick="saveCat()" style="border-color:var(--accent); color:var(--accent);">Guardar Categoría</button>
        </div>

        <hr>
        <h3>Gestión de Datos</h3>
        <div id="manage-gyms" style="margin-bottom:8px;"></div>
        <div id="manage-cats" style="margin-bottom:8px;"></div>
        <div id="manage-trainers"></div>
    </div>

</div>

<footer>
    <div class="footer-brand">Murano Puerto Montt</div>
    <div class="footer-divider"></div>
    <div class="socials">
        <!-- Instagram -->
        <a href="https://www.instagram.com/murano.pm?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

</footer>

<script>
    const days = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes'];
    const timeSlots = ["17:30", "19:00", "20:30", "22:00"];
    const timeMap = {
        "17:30": "17:30–19:00",
        "19:00": "19:00–20:30",
        "20:30": "20:30–22:00",
        "22:00": "22:00–23:30"
    };

    function safeKey(str) {
        return String(str).replace(/[^a-zA-Z0-9_-]/g, '_');
    }

    function escQ(str) {
        return String(str || '').replace(/'/g, "\\'");
    }

    function toast(msg, duration = 2600) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(el._timer);
        el._timer = setTimeout(() => el.classList.remove('show'), duration);
    }

    function showView(v) {
        ['main-view', 'auth-view', 'admin-panel-view'].forEach(id => {
            document.getElementById(id).classList.add('hidden');
        });
        document.getElementById(v).classList.remove('hidden');
    }

    async function login() {
        try {
            const res = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    email: document.getElementById('l_email').value,
                    password: document.getElementById('l_pass').value
                })
            });
            if (res.ok) {
                const d = await res.json();
                localStorage.setItem('user_id', d.user_id);
                localStorage.setItem('email', d.email);
                localStorage.setItem('role', d.role);
                location.reload();
            } else {
                toast('Credenciales incorrectas');
            }
        } catch (e) { toast('Error de conexión'); }
    }

    async function register() {
        try {
            const res = await fetch('/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    email: document.getElementById('l_email').value,
                    password: document.getElementById('l_pass').value,
                    adminKey: document.getElementById('r_key').value
                })
            });
            if (res.ok) toast('Usuario registrado correctamente');
            else toast('Error en el registro');
        } catch (e) { toast('Error de conexión'); }
    }

    function logout() { localStorage.clear(); location.reload(); }

    function updateUI() {
        const user = localStorage.getItem('email');
        const role = localStorage.getItem('role');
        const panel = document.getElementById('auth-panel');
        if (user) {
            panel.innerHTML = `
                <span>${user}</span>
                ${role === 'admin' ? '<button onclick="loadAdminPanel()" style="border-color:var(--accent);color:var(--accent);">Admin</button>' : ''}
                <button onclick="logout()">Salir</button>`;
        } else {
            panel.innerHTML = `<button onclick="showView('auth-view')" style="border-color:var(--accent);color:var(--accent);">Ingresar</button>`;
        }
    }

    async function loadAdminPanel() {
        showView('admin-panel-view');
        try {
            const [gyms, cats, trainers] = await Promise.all([
                (await fetch('/gyms')).json(),
                (await fetch('/categories')).json(),
                (await fetch('/trainers')).json()
            ]);

            document.getElementById('t_gym').innerHTML = gyms.map(g =>
                `<option value="${g.id}">${g.name}</option>`).join('');
            document.getElementById('t_cat').innerHTML = cats.map(c =>
                `<option value="${c.id}">${c.name}${c.trainer_name ? ' · ' + c.trainer_name : ''}</option>`).join('');

            document.getElementById('manage-gyms').innerHTML = `
                <details>
                    <summary>Gimnasios (${gyms.length})</summary>
                    ${gyms.map(g => `
                    <div class="admin-list-item">
                        <span>${g.name}</span>
                        <div class="item-actions">
                            <button onclick="editGymPrompt(${g.id}, '${escQ(g.name)}', '${escQ(g.address)}', '${escQ(g.image_url || '')}')">Editar</button>
                            <button style="border-color:var(--danger);color:var(--danger)" onclick="deleteData('gyms', ${g.id})">Borrar</button>
                        </div>
                    </div>`).join('')}
                </details>`;

            document.getElementById('manage-cats').innerHTML = `
                <details>
                    <summary>Categorías (${cats.length})</summary>
                    ${cats.map(c => `
                    <div class="admin-list-item">
                        <span>${c.name}${c.trainer_name ? ' · <em>' + c.trainer_name + '</em>' : ''}</span>
                        <div class="item-actions">
                            <button onclick="editCatPrompt(${c.id}, '${escQ(c.name)}', '${escQ(c.trainer_name || '')}', '${escQ(c.image_url || '')}', '${escQ(c.trainer_image_url || '')}')">Editar</button>
                            <button style="border-color:var(--danger);color:var(--danger)" onclick="deleteData('categories', ${c.id})">Borrar</button>
                        </div>
                    </div>`).join('')}
                </details>`;

            document.getElementById('manage-trainers').innerHTML = `
                <details>
                    <summary>Profesores (${trainers.length})</summary>
                    ${trainers.map(t => `
                    <div class="admin-list-item">
                        <span>${t.name}</span>
                        <div class="item-actions">
                            <button style="border-color:var(--danger);color:var(--danger)" onclick="deleteTrainer('${escQ(t.name)}')">Desvincular</button>
                        </div>
                    </div>`).join('')}
                </details>`;
        } catch (e) { toast('Error cargando datos admin'); }
    }

    function editGymPrompt(id, name, address, img) {
        const nName = prompt("Nombre:", name);
        if (!nName) return;
        const nAddress = prompt("Dirección:", address);
        const nImg = prompt("URL imagen:", img);
        updateGym(id, nName, nAddress, nImg);
    }

    async function updateGym(id, name, address, img) {
        await fetch(`/gyms/${id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name, address, image_url: img})
        });
        toast('Gimnasio actualizado');
        loadAdminPanel();
    }

    function editCatPrompt(id, name, trainer, img, t_img) {
        const nName = prompt("Nombre categoría:", name);
        if (!nName) return;
        const nTrainer = prompt("Entrenador:", trainer);
        const nImg = prompt("URL imagen categoría:", img);
        const nTImg = prompt("URL foto entrenador:", t_img);
        updateCat(id, nName, nTrainer, nImg, nTImg);
    }

    async function updateCat(id, name, trainer, img, t_img) {
        await fetch(`/categories/${id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name, trainer_name: trainer, image_url: img, trainer_image_url: t_img})
        });
        toast('Categoría actualizada');
        loadAdminPanel();
    }

    async function deleteData(type, id) {
        if (!confirm("¿Seguro que deseas eliminar este elemento?")) return;
        const res = await fetch(`/${type}/${id}`, {method: 'DELETE'});
        if (res.ok) { toast('Eliminado correctamente'); loadAdminPanel(); }
        else toast('Error al eliminar');
    }

    async function deleteTrainer(name) {
        if (!confirm(`¿Desvincular al profesor ${name}?`)) return;
        const res = await fetch(`/trainers/${encodeURIComponent(name)}`, {method: 'DELETE'});
        if (res.ok) { toast('Profesor desvinculado'); loadAdminPanel(); }
        else toast('Error al desvincular');
    }

    // Construye la URL del mapa embebido a partir de la dirección + "Puerto Montt"
    function buildMapUrl(address) {
        if (!address) return null;
        const query = encodeURIComponent(address + ', Puerto Montt, Chile');
        return `https://maps.google.com/maps?q=${query}&output=embed&z=16`;
    }

    async function renderList(type) {
        showView('main-view');
        const url = type === 'gym' ? '/gyms' : type === 'cat' ? '/categories' : '/trainers';
        const data = await (await fetch(url)).json();

        document.getElementById('list-container').innerHTML = data.map(item => {
            const key = safeKey(item.id || item.name);
            const rawId = type === 'trainer' ? item.name : item.id;
            const mapUrl = (type === 'gym' && item.address) ? buildMapUrl(item.address) : null;

            return `
            <div class="card" id="card-wrapper-${key}">
                <div class="card-inner">
                    <div class="card-info">
                        <div class="img-box">
                            <img src="${item.image_url || 'https://via.placeholder.com/300x300/111111/FF5722?text=+'}"
                                 onerror="this.src='https://via.placeholder.com/300x300/111111/FF5722?text=+'"
                                 loading="lazy">
                        </div>
                        <div class="card-text-group">
                            <h3>${item.name}</h3>
                            ${item.address ? `<div class="card-address">${item.address}</div>` : ''}
                            ${mapUrl ? `<iframe class="gym-map" src="${mapUrl}" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Mapa ${escQ(item.name)}"></iframe>` : ''}
                            <button onclick="toggleSchedule(this, '${type}', '${escQ(String(rawId))}', '${key}')"
                                    style="width:100%; border-color:var(--accent); color:var(--accent); margin-top:10px;">
                                Ver Horarios
                            </button>
                        </div>
                    </div>
                    <div class="card-schedule hidden" id="sched-${key}"></div>
                </div>
            </div>`;
        }).join('');
    }

    async function toggleSchedule(btn, type, id, wrapperKey) {
        const container = document.getElementById(`sched-${wrapperKey}`);
        const cardWrapper = document.getElementById(`card-wrapper-${wrapperKey}`);

        if (!container.classList.contains('hidden')) {
            container.classList.add('hidden');
            cardWrapper.classList.remove('expanded');
            btn.textContent = 'Ver Horarios';
            btn.style.borderColor = 'var(--accent)';
            btn.style.color = 'var(--accent)';
            return;
        }

        btn.textContent = 'Cargando...';
        const url = type === 'gym'
            ? `/trainings/by-gym/${id}`
            : type === 'cat'
                ? `/trainings/by-cat/${id}`
                : `/trainings/by-trainer/${encodeURIComponent(id)}`;

        try {
            const trs = await (await fetch(url)).json();
            container.innerHTML = generateGridHTML(trs);
            container.classList.remove('hidden');
            cardWrapper.classList.add('expanded');
            btn.textContent = 'Ocultar';
            btn.style.borderColor = 'var(--text-muted)';
            btn.style.color = 'var(--text-muted)';
        } catch (e) {
            btn.textContent = 'Ver Horarios';
            toast('Error cargando horarios');
        }
    }

    function generateGridHTML(trs) {
        let html = `<div class="schedule-grid">`;
        html += `<div class="cell header">Hora</div>`;
        days.forEach(d => html += `<div class="cell header">${d}</div>`);
        timeSlots.forEach(slot => {
            html += `<div class="cell time-label">${timeMap[slot]}</div>`;
            days.forEach(d => {
                const matches = trs.filter(t => t.day_of_week === d && t.start_time === slot);
                html += `<div class="cell">${matches.map(t => renderEventCard(t)).join('')}</div>`;
            });
        });
        return html + `</div>`;
    }

    function renderEventCard(t) {
        const titulo = t.category_name || t.gym_name || "Entrenamiento";
        const isAdmin = localStorage.getItem('role') === 'admin';
        return `
            <div class="event-card">
                <div class="ev-title">${titulo}</div>
                ${t.gym_name ? `<div class="ev-gym">${t.gym_name}</div>` : ''}
                <div class="ev-trainer">${t.trainer_name || 'Sin profesor'}</div>
                <div class="ev-actions">
                    <button class="btn-control" onclick="toggleFav(${t.id})" title="Favorito">⭐</button>
                    ${isAdmin ? `<button class="btn-control danger" onclick="deleteTraining(${t.id})" title="Eliminar">✕</button>` : ''}
                </div>
            </div>`;
    }

    async function saveTraining() {
        const data = {
            gym_id: document.getElementById('t_gym').value,
            category_id: document.getElementById('t_cat').value,
            day_of_week: document.getElementById('t_day').value,
            start_time: document.getElementById('t_start').value
        };
        const res = await fetch('/trainings', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        if (res.ok) { toast('Entrenamiento creado'); setTimeout(() => location.reload(), 800); }
        else toast('Error al crear entrenamiento');
    }

    async function deleteTraining(id) {
        if (!confirm("¿Eliminar este entrenamiento?")) return;
        await fetch(`/trainings/${id}`, {method: 'DELETE'});
        toast('Entrenamiento eliminado');
        setTimeout(() => location.reload(), 800);
    }

    async function toggleFav(tId) {
        const userId = localStorage.getItem('user_id');
        if (!userId) { toast('Inicia sesión para guardar favoritos'); return; }
        try {
            const res = await fetch('/toggle-favorite', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({training_id: tId, user_id: userId})
            });
            const d = await res.json();
            toast(d.action === 'added' ? '⭐ Agregado a favoritos' : 'Eliminado de favoritos');
        } catch (e) { toast('Error actualizando favoritos'); }
    }

    async function saveGym() {
        const data = {
            name: document.getElementById('g_name').value,
            address: document.getElementById('g_address').value,
            image_url: document.getElementById('g_img').value
        };
        const res = await fetch('/gyms', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        if (res.ok) { toast('Gimnasio guardado'); setTimeout(() => location.reload(), 800); }
        else toast('Error al guardar');
    }

    async function saveCat() {
        const res = await fetch('/categories', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                name: document.getElementById('cat_name').value,
                trainer_name: document.getElementById('trainer_name').value,
                image_url: document.getElementById('cat_img').value,
                trainer_image_url: document.getElementById('trainer_img').value
            })
        });
        if (res.ok) { toast('Categoría guardada'); setTimeout(() => location.reload(), 800); }
        else toast('Error al guardar');
    }

    async function renderFavorites() {
        showView('main-view');
        const userId = localStorage.getItem('user_id');
        if (!userId) { toast('Inicia sesión para ver tus favoritos'); return; }
        try {
            const trs = await (await fetch(`/favorites/${userId}`)).json();
            document.getElementById('list-container').innerHTML = `
                <div class="favs-wrapper">
                    <h2>⭐ Mis Favoritos</h2>
                    <div style="padding: 0 16px 16px;">
                        ${trs.length === 0
                            ? '<p style="color:var(--text-muted); font-size:0.9em; padding-top:4px;">No tienes entrenamientos guardados aún.</p>'
                            : generateGridHTML(trs)
                        }
                    </div>
                </div>`;
        } catch (e) { toast('Error cargando favoritos'); }
    }

    updateUI();
</script>
</body>
