<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="description" content="Horarios de entrenamientos del Club Murano Voley de Puerto Montt. Consulta canchas, categorías y profesores.">
    <title>Murano Voley Puerto Montt - Horarios</title>
    
    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Estilos Modularizados -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="toast"></div>

<!-- ENCABEZADO PRINCIPAL -->
<header>
    <div class="header-left">
        <div class="logo-box">
            <img src="logomurano.png" alt="Logo Murano">
        </div>
        <div class="brand" onclick="showView('main-view')">
            Murano<span>PM</span>
            <small>Puerto Montt</small>
        </div>
    </div>
    <div id="auth-panel">
        <!-- Se llena dinámicamente vía script.js -->
    </div>
</header>

<div class="container">

    <!-- VISTA PRINCIPAL: Navegación y Listados -->
    <div id="main-view" class="view-anim">
        <div class="nav-bar">
            <button onclick="renderList('gym')">Canchas</button>
            <button onclick="renderList('cat')">Categorías</button>
            <button onclick="renderList('trainer')">Profesores</button>
            <button style="border-color:var(--success); color:var(--success);" onclick="renderFavorites()">⭐ Favoritos</button>
        </div>
        
        <!-- Mapa Global para Gimnasios -->
        <div id="global-map-wrapper" class="hidden" style="margin-bottom: 20px; width: 100%; text-align: center;">
            <button id="toggle-map-btn" onclick="toggleGlobalMap()" style="margin-bottom: 15px; border-color: var(--accent); color: var(--accent); font-size: 1rem;">🗺️ Ver Mapa del Complejo</button>
            <div id="global-map-container" class="hidden"></div>
        </div>

        <div id="list-container">
            <!-- Aquí se cargan las cards dinámicamente -->
        </div>
    </div>

    <!-- VISTA ACCESO: Login y Registro -->
    <div id="auth-view" class="panel-card view-anim hidden">
        <h2>Acceso</h2>
        <button onclick="showView('main-view')" style="margin-bottom:20px;">← Volver</button>
        
        <div class="form-group">
            <input type="email" id="l_email" placeholder="Correo electrónico" autocomplete="email">
            <input type="password" id="l_pass" placeholder="Contraseña" autocomplete="current-password">
            <input type="text" id="r_key" placeholder="Clave admin (solo para registro)">
        </div>

        <div class="btn-row" style="margin-top:14px;">
            <button onclick="login()" style="border-color:var(--accent); color:var(--accent);">Ingresar</button>
            <button onclick="register()" style="border-color:var(--success); color:var(--success);">Registrarse</button>
        </div>
    </div>

    <!-- VISTA ADMINISTRACIÓN: Gestión de contenido -->
    <div id="admin-panel-view" class="admin-panel-wide view-anim hidden">
        <h2>Panel Administración</h2>
        <button onclick="showView('main-view')" style="margin-bottom:20px;">← Volver</button>

        <!-- Crear Horarios -->
        <h3>Crear Entrenamiento</h3>
        <select id="t_gym"></select>
        <select id="t_cat"></select>
        <select id="t_day">
            <option value="Lunes">Lunes</option>
            <option value="Martes">Martes</option>
            <option value="Miércoles">Miércoles</option>
            <option value="Jueves">Jueves</option>
            <option value="Viernes">Viernes</option>
        </select>
        <select id="t_start">
            <option value="17:30">17:30 – 19:00</option>
            <option value="19:00">19:00 – 20:30</option>
            <option value="20:30">20:30 – 22:00</option>
            <option value="22:00">22:00 – 23:30</option>
        </select>
        <div class="btn-row">
            <button onclick="saveTraining()" style="border-color:var(--success); color:var(--success);">Crear Entrenamiento</button>
        </div>

        <hr>
        <!-- Gestión de Gimnasios -->
        <h3>Gimnasio</h3>
        <input type="text" id="g_name" placeholder="Nombre del gimnasio">
        <input type="text" id="g_address" placeholder="Dirección">
        <input type="text" id="g_img" placeholder="URL imagen del gimnasio">
        <div class="btn-row">
            <button onclick="saveGym()" style="border-color:var(--accent); color:var(--accent);">Guardar Gimnasio</button>
        </div>

        <hr>
        <!-- Gestión de Categorías/Profesores -->
        <h3>Categoría / Profesor</h3>
        <input type="text" id="cat_name" placeholder="Nombre de la categoría">
        <input type="text" id="trainer_name" placeholder="Nombre del entrenador">
        <input type="text" id="cat_img" placeholder="URL imagen categoría">
        <input type="text" id="trainer_img" placeholder="URL foto entrenador">
        <div class="btn-row">
            <button onclick="saveCat()" style="border-color:var(--accent); color:var(--accent);">Guardar Categoría</button>
        </div>

        <hr>
        <!-- Listados de Gestión -->
        <h3>Gestión de Datos</h3>
        <div id="manage-gyms" style="margin-bottom:8px;"></div>
        <div id="manage-cats" style="margin-bottom:8px;"></div>
        <div id="manage-trainers"></div>
    </div>

</div>

<!-- PIE DE PÁGINA -->
<footer>
    <div class="footer-brand">Murano<span>PM</span></div>
    <div class="footer-subtitle">Club de Voleibol Puerto Montt</div>
    
    <div class="socials">
        <!-- Instagram -->
        <a href="https://www.instagram.com/murano.pm?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" target="_blank" rel="noopener" class="social-btn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
            </svg>
            Instagram
        </a>
        <!-- YouTube -->
        <a href="https://www.youtube.com/@MuranoPuertoMontt" target="_blank" rel="noopener" class="social-btn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
            YouTube
        </a>
        <!-- Email -->
        <a href="mailto:puertomonttmurano@gmail.com" class="social-btn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
            </svg>
            Contacto
        </a>
    </div>
    
    <div class="footer-bottom">
        <p>© <span id="current-year"></span> Todos los derechos reservados.</p>
        <p style="opacity: 0.5;">Desarrollado para Murano Voley</p>
    </div>
</footer>

<!-- Lógica Modularizada -->
<script>document.getElementById('current-year').textContent = new Date().getFullYear();</script>
<script src="script.js"></script>
</body>
</html>
